name: Royal Celebrity Solo Booking Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcx-solo-booking-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run targeted solo booking diagnostic
        shell: bash
        run: |
          set -o pipefail
          python run_rcx_solo_booking_diagnostic.py 2>&1 | tee rcx-solo-booking-diagnostic.txt

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcx-solo-booking-diagnostic
          path: rcx-solo-booking-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
