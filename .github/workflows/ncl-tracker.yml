name: NCL Cruise Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7,19 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: ncl-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NCL tracker
        shell: bash
        run: |
          set -o pipefail
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          if ! python run_ncl.py 2>&1 | tee run.log; then
            echo "::error title=NCL tracker failed (last 40 lines)::$(tail -n 40 run.log | enc)"
            exit 1
          fi
          echo "::notice title=NCL summary::$(grep -iE 'coverage:|production result|returned' run.log | tail -n 15 | enc)"

      - name: Commit updated cruise data
        shell: bash
        run: |
          git config user.name "cruise-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cruises.db data/latest.json
          git diff --cached --quiet && { echo "No data changes"; exit 0; }
          git commit -m "Update NCL cruise prices"
          out=""
          for attempt in 1 2 3; do
            if out=$( { git pull --rebase origin main && git push origin HEAD:main; } 2>&1 ); then
              echo "$out"; exit 0
            fi
            echo "$out"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "::error title=Data commit failed after 3 attempts::$(echo "$out" | tail -n 25 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 1
