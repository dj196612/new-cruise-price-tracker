name: Princess Standard Excel Export

on:
  workflow_dispatch:
  push:
    paths:
      - 'export_princess_standard_excel.py'

permissions:
  contents: read

env:
  TZ: Australia/Sydney

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Export Princess Standard fares
        run: python export_princess_standard_excel.py

      - name: Upload Excel export
        uses: actions/upload-artifact@v4
        with:
          name: princess-standard-fares
          path: reports/Princess_Standard_Fares.xlsx
          if-no-files-found: error
