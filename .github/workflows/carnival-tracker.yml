name: Carnival Cruise Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carnival-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARNIVAL_VIFP: ${{ secrets.CARNIVAL_VIFP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Carnival diagnostic
        run: python run_carnival.py
