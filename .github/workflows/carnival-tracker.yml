name: Carnival Cruise Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carnival-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARNIVAL_VIFP: ${{ secrets.CARNIVAL_VIFP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Carnival diagnostic
        shell: bash
        run: |
          set -o pipefail
          python run_carnival.py 2>&1 | tee carnival-diagnostic.txt

      - name: Upload redacted Carnival diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carnival-diagnostic
          path: carnival-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
