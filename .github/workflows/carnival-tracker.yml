name: Carnival Cruise Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "20 7,19 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: carnival-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Carnival tracker
        run: python run_carnival.py

      - name: Commit updated cruise data
        shell: bash
        run: |
          git config user.name "cruise-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cruises.db data/latest.json
          git diff --cached --quiet && { echo "No data changes"; exit 0; }
          git commit -m "Update Carnival cruise prices"
          out=""
          for attempt in 1 2 3; do
            if out=$( { git pull --rebase origin main && git push origin HEAD:main; } 2>&1 ); then
              echo "$out"; exit 0
            fi
            echo "$out"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "::error title=Data commit failed after 3 attempts::$(echo "$out" | tail -n 25 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 1
