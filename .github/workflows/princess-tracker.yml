name: Princess Cruise Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: princess-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Princess tracker
        shell: bash
        run: |
          set -o pipefail
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          if ! python run_tracker.py 2>&1 | tee run.log; then
            echo "::error title=Princess tracker failed (last 40 lines)::$(tail -n 40 run.log | enc)"
            exit 1
          fi
          echo "::notice title=Princess solo summary::$(grep -iE 'solo (result|graph|repair|interior pricing)|solo Interior pricing|production result' run.log | tail -n 15 | enc)"

      - name: Commit updated cruise data
        run: |
          git config user.name "cruise-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cruises.db data/latest.json
          git diff --cached --quiet || git commit -m "Update Princess cruise prices"
          git push
