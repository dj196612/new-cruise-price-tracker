name: Princess Cruise Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: princess-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Princess tracker
        run: python run_tracker.py

      - name: Commit updated data
        run: |
          git config user.name "cruise-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cruises.db data/latest.json
          git diff --cached --quiet || git commit -m "Update Princess cruise prices"
          git push
