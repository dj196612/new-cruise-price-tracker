name: Celebrity Cruise Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celebrity-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Celebrity diagnostic
        run: python run_celebrity.py
