name: Celebrity Cruise Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "40 6,18 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: celebrity-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Celebrity tracker
        run: python run_celebrity.py

      - name: Commit updated cruise data
        run: |
          git config user.name "cruise-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cruises.db data/latest.json
          git diff --cached --quiet || git commit -m "Update Celebrity cruise prices"
          git push
