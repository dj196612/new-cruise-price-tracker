name: Celebrity Cruise Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "40 6,18 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: celebrity-cruise-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Celebrity tracker
        shell: bash
        run: |
          set -o pipefail
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          if ! python run_celebrity.py 2>&1 | tee run.log; then
            echo "::error title=Celebrity tracker failed (last 40 lines)::$(tail -n 40 run.log | enc)"
            exit 1
          fi
          echo "::notice title=Celebrity solo summary::$(grep -iE 'solo (result|graph|repair|interior pricing)|solo Interior pricing|production result' run.log | tail -n 15 | enc)"
          if grep -q "solo empty" run.log; then echo "::notice title=Celebrity empty solo reasons ($(grep -c "solo empty" run.log) sailings)::$(grep "solo empty" run.log | head -n 8 | enc)"; fi

      - name: Commit updated cruise data
        run: |
          git config user.name "cruise-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cruises.db data/latest.json
          git diff --cached --quiet || git commit -m "Update Celebrity cruise prices"
          git pull --rebase origin main
          git push
